<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRCOverlay</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="world.css">
</head>

<body class="trasparent-bg">
    <div id="box" class="box">
        <div class="overlay-card">
            <div id="pfp-container">
                <img id="world-pfp" class="radius-pfp" src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fapi.vrchat.cloud%2Fapi%2F1%2Ffile%2Ffile_c2b7ad18-5276-4e9b-aef7-8e18555e5030%2F7%2Ffile&f=1&nofb=1&ipt=0e5410108d29cb32e76debcc7bd3d82596ee2dc7c31844fbcbfde71871133528" alt="default world">
            </div>
            <div class="info-container">
                <h3 class="title">
                    <span id="world-name">Loading... </span>
                    <span id="pcTag" class="tag is-dark is-medium is-hidden">PC</span>
                    <span id="androidTag" class="tag is-dark is-medium is-hidden">Android</span>
                    <span id="iosTag" class="tag is-dark is-medium is-hidden">IOS</span>
                </h3>
                <h4 id="world-author" class="title is-4">Loading...</h4>
            </div>
        </div>
    </div>
    <script src="world.js"></script>
</body>
</html>
