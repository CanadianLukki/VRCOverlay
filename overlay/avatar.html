<head>
    <!DOCTYPE html>
    <html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRCOverlay</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="avatar.css">
</head>

<body class="trasparent-bg">
    <div id="box" class="box m-6">
        <h2 class="title is-2">Current avatar:</h2>
        <div class="columns">
            <div class="column is-one-third">
                <figure class="image is-4by3">
                    <img id="avatar-pfp" class="radius-pfp" src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Ftse4.mm.bing.net%2Fth%2Fid%2FOIP.QU1p_P68Rtu39zJg0TXDKgHaFj%3Fpid%3DApi&f=1&ipt=10d1045ca09161cd432b3c20ef277c1ebc443c1f5f548bf0bf6cbeeb39df2da1&ipo=images" alt="default robot">
                </figure>
            </div>
            <div class="column">
                <h3 class="title">
                    <span id="avatar-name">Loading... </span>
                    <span id="avatar-rating" class="tag is-dark is-medium">Loading...</span>
                </h3>
                <h4 id="avatar-author" class="title is-4">
                    <span id="author-name">Loading..</span>
                    <span id="private-tag" class="tag private-tag is-medium">Private</span>
                </h4>
                <h6 id="watermark" class="has-text-right is-size-6 pr-2">Made by Lukki</h6>
            </div>
        </div>
    </div>
    <script src="avatar.js"></script>
</body>
